<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    /* surfaces — the green wash lives here; flatten these for neutral, deepen the green channel for more brand */
    --bg-deep:     #0a0d0b;   /* page background */
    --bg-panel:    #121712;   /* toolbars, table header, job meta, tooltips, tabs */
    --bg-deep-rgb: 10,13,11;    /* matches --bg-deep, for the translucent header */

    /* accents */
    --accent:      #00a473;   /* DCP green, primary + interactive */
    --accent-rgb:  0,164,115;   /* matches --accent, for tint fills */
    --accent-lt:   #6fc495;   /* lighter green, for press/hover pop */
    --value:       #d6efe2;   /* DCP yellow #ffde17, earnings + progress + running */

    /* text */
    --text:        #d6efe2;
    --text-dim:    #5d8b76;

    /* lines */
    --border:      rgba(var(--accent-rgb), 0.12);
    --border-md:   rgba(var(--accent-rgb), 0.2);
    --grid-line:   rgba(var(--accent-rgb), 0.05);

    /* status */
    --ok:          #3ecf8e;    /* alive dot, done pill (was --ok) */
    --danger:      #e05555;    /* errors */
    --danger-rgb:  224,85,85;  /* matches --danger, for tint fills */
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    font-family: 'Syne', sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridDrift 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes gridDrift {
    from { background-position: 0 0; }
    to   { background-position: 40px 40px; }
  }

  /* ── Desktop layout ── */
  .app {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    height: 100vh;
    position: relative;
    z-index: 1;
  }

  .header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    border-bottom: 0.5px solid var(--border-md);
    background: rgba(var(--bg-deep-rgb),0.8);
    backdrop-filter: blur(8px);
  }

  .header-logo { font-size: 28px; line-height: 1; user-select: none; }
  .header-logo svg { display: block; height: 28px; width: auto; }

  .header-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.04em;
  }

  .header-sub {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .header-divider {
    width: 0.5px;
    height: 28px;
    background: var(--border-md);
    margin: 0 8px;
  }

  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  .panel-left { border-right: none; }

  .panel-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 0.5px solid var(--border);
    background: var(--bg-panel);
    flex-shrink: 0;
  }

  .toolbar-worker-count {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    display: flex;
    align-items: baseline;
    gap: 5px;
  }
  .toolbar-worker-count .count-active { font-size: 13px; color: var(--text); letter-spacing: 0.05em; }
  .toolbar-worker-count .count-sep    { color: var(--text-dim); font-size: 8px; }
  .toolbar-worker-count .count-total  { font-size: 11px; color: rgba(var(--accent-rgb),0.45); letter-spacing: 0.05em; }

  .toolbar-icon-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    border-radius: 2px;
    transition: color 0.15s, background 0.15s;
  }
  .toolbar-icon-btn:hover    { color: var(--accent); background: rgba(var(--accent-rgb),0.08); }
  .toolbar-icon-btn:disabled { opacity: 0.3; cursor: default; }

  .toolbar-sep { width: 0.5px; height: 16px; background: var(--border-md); }

  .pg-info {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .table-scroll {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  .table-scroll::-webkit-scrollbar       { width: 4px; }
  .table-scroll::-webkit-scrollbar-track { background: transparent; }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 2px; }

  table { width: 100%; border-collapse: collapse; }

  thead {
    position: sticky;
    top: 0;
    background: var(--bg-panel);
    z-index: 2;
  }

  th {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 10px;
    text-align: left;
    border-bottom: 0.5px solid var(--border-md);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  th:hover { color: var(--accent); }

  td {
    padding: 8px 10px;
    border-bottom: 0.5px solid var(--border);
    vertical-align: middle;
    font-size: 12px;
    color: var(--text-dim);
  }

  th:nth-child(1), td:nth-child(1) { width: 32px; padding-left: 14px; padding-right: 0; }
  th:nth-child(2), td:nth-child(2) { width: 20px; padding-left: 0; padding-right: 0; text-align: center; }
  th:nth-child(3), td:nth-child(3) { width: 24px; padding-left: 0; padding-right: 4px; text-align: center; }
  th:nth-child(4), td:nth-child(4) { padding-left: 4px; }

  tbody tr               { cursor: pointer; transition: background 0.1s; }
  tbody tr:hover td      { background: rgba(var(--accent-rgb),0.05); }
  tbody tr.selected td   { background: rgba(var(--accent-rgb),0.1); }
  tbody tr:last-child td { border-bottom: none; }

  .mono { font-family: 'Space Mono', monospace; font-size: 10px; }

  .empty-row td {
    text-align: center;
    padding: 2rem;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-style: italic;
    color: var(--text-dim);
  }

  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot-green { background: var(--ok); box-shadow: 0 0 4px var(--ok); }
  .dot-red   { background: rgba(var(--danger-rgb),0.5); }

  .worker-icon {
    width: 12px; height: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--text-dim);
    flex-shrink: 0;
    vertical-align: middle;
  }
  .worker-icon svg { width: 100%; height: 100%; }

  .label-text  { color: var(--text-dim); font-size: 12px; }
  .earnings-val { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--value); }


  /* Detail drawer */
  .detail-row-inline-cell {
    padding: 0 !important;
    background: rgba(var(--accent-rgb),0.04);
    border-bottom: 0.5px solid var(--border-md);
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s ease;
  }
  .detail-row-inline.open .detail-row-inline-cell {
    max-height: 300px;
  }
  .detail-row-inline:not(.open) .detail-row-inline-cell {
    border-bottom: none;
    display: none;
  }
  .detail-inner {
    padding: 12px 16px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .detail-group h4 {
    font-family: 'Space Mono', monospace;
    font-size: 8px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 6px;
  }

  .detail-row {
    display: flex; justify-content: space-between;
    padding: 2px 0; border-bottom: 0.5px solid var(--border); gap: 8px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-key { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--text-dim); white-space: nowrap; }
  .detail-val { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--text); text-align: right; word-break: break-all; }


  .notice {
    font-family: 'Space Mono', monospace; font-size: 9px;
    padding: 6px 16px; letter-spacing: 0.1em;
    color: var(--danger); background: rgba(var(--danger-rgb),0.08);
    border-bottom: 0.5px solid rgba(var(--danger-rgb),0.2);
  }

  input[type=checkbox] {
    appearance: none; width: 11px; height: 11px;
    border: 0.5px solid var(--text-dim); border-radius: 0;
    background: transparent; cursor: pointer;
    position: relative; display: inline-block; vertical-align: middle;
  }
  input[type=checkbox]:checked::after {
    content: ''; position: absolute;
    left: 2px; top: -1px; width: 5px; height: 8px;
    border: 1.5px solid var(--accent); border-top: none; border-left: none;
    transform: rotate(45deg);
  }

  /* ══════════════════════════════════════════
     MOBILE — slide tabs
  ══════════════════════════════════════════ */
  @media (max-width: 700px) {
    body { overflow: hidden; }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .panels-viewport { flex: 1; min-height: 0; display: flex; }
    .panels-track    { display: flex; width: 100%; height: 100%; }
    .panel-left      { width: 100%; flex-shrink: 0; }


    /* detail drawer collapses to 2-col on mobile */
    .detail-inner { grid-template-columns: repeat(2, 1fr); }

    /* header smaller on mobile */
    .header { padding: 10px 16px; }
    .header-logo { font-size: 22px; }
    .header-title { font-size: 13px; }
  }

  /* hide slide tabs on desktop */
  @media (min-width: 701px) {
    .panels-viewport { display: contents; }
    .panels-track    { display: contents; }
  }
</style>
</head>
<body>

<div class="app">

<script>
  /* ── Workers ── */
  const PAGE_SIZE = 50;
  let allWorkers  = [];
  let filtered    = [];
  let currentPage = 0;
  let selectedIds = new Set();
  let selectedId  = null;
  let sortField   = 'taskTime';
  let sortDir     = -1;
  let db          = null;

  async function getDb() {
    if (db) return db;
    const keystore = await new dcp.wallet.Keystore(
      '0x87ba424720c4a221f0f9c541928f366b2d1b6c78bff4107288c1e9985dd88a91', ''
    );
    db = await dcp.jnu.connect('scheduler', keystore);
    return db;
  }

  function timeAgo(d) {
    if (!d) return 'never';
    d = new Date(d);
    if (isNaN(d)) return '—';
    const s = Math.round((Date.now() - d) / 1000);
    if (s < 60)    return `${s}s ago`;
    if (s < 3600)  return `${Math.round(s/60)}m ago`;
    if (s < 86400) return `${Math.round(s/3600)}h ago`;
    return `${Math.round(s/86400)}d ago`;
  }

  function fmtDcc(raw) {
    if (raw == null) return '—';
    const n = Number(raw);
    if (isNaN(n)) return '—';
    return n.toFixed(3) + ' ⊇';
  }

  function trunc(str, len = 12) {
    if (!str) return '—';
    str = String(str);
    return str.length > len ? str.slice(0, 6) + '…' + str.slice(-4) : str;
  }

  function setNotice(msg) {
    const el = document.getElementById('panel-notice');
    el.innerHTML = msg ? `<div class="notice">${msg}</div>` : '';
  }

  function workerIcon(w) {
    const label   = (w.label        || '').toLowerCase();
    const os      = (w.os           || '').toLowerCase();
    const browser = (w.browser?.type || '').toLowerCase();

    // label checks first — most specific signal
    const labelMatches = [
      ['chrome',   'chrome'],
      ['firefox',  'firefox'],
      ['safari',   'safari'],
      ['ios',      'safari'],
      ['edge',     'edge'],
      ['opera',    'opera'],
      ['brave',    'brave'],
      ['docker',   'docker'],
      ['ilovedcp', 'dcp'],
    ];
    for (const [kw, icon] of labelMatches)
      if (label.includes(kw) && ICONS[icon]) return ICONS[icon];

    // OS checks
    const osMatches = [
      [/ios|iphone|ipad/, 'safari'],
      [/android/,         'android'],
      [/win/,             'windows'],
      [/mac/,             'mac'],
      [/linux/,           'linux'],
    ];
    for (const [re, icon] of osMatches)
      if (re.test(os) && ICONS[icon]) return ICONS[icon];

    // browser type fallback
    const browserMatches = [
      ['chrome',  'chrome'],
      ['firefox', 'firefox'],
      ['safari',  'safari'],
      ['edge',    'edge'],
      ['opera',   'opera'],
      ['brave',   'brave'],
    ];
    for (const [kw, icon] of browserMatches)
      if (browser.includes(kw) && ICONS[icon]) return ICONS[icon];

    return null;
  }

  async function fetchWorkerSnapshots() {
    try {
      const conn   = await getDb();
      const cursor = await conn.select({ table: 'workerSnapshot', prototype: {} });
      const rows   = [];
      for (let row = await cursor.getFirst(); row; row = await cursor.getNext())
        rows.push(row);
      return rows;
    } catch(e) {
      console.warn('[workers] fetch failed', e);
      return null;
    }
  }

  function sortBy(field) {
    sortField === field ? sortDir *= -1 : (sortField = field, sortDir = -1);
    applySearch();
  }

  function applySearch() {
    filtered = [...allWorkers];
    filtered.sort((a, b) => {
      let av = a[sortField] ?? '', bv = b[sortField] ?? '';
      return av < bv ? sortDir : av > bv ? -sortDir : 0;
    });
    currentPage = 0;
    renderPage();
  }

  function populateDetailGrid(id) {
    const w = allWorkers.find(w => (w.id ?? w.workerOpaqueId) === id);
    if (!w) return;
    const grid = document.getElementById(`detail-grid-${id}`);
    if (!grid) return;
    const sections = [
      { title: 'Host', rows: [
        ['Hostname',  w.hostname],
        ['Local IP',  w.localIpAddress],
        ['MAC',       w.macAddress],
        ['OS',        w.os],
        ['Browser',   w.browser?.type ? `${w.browser.type} ${w.browser.version}` : null],
        ['Site',      w.browser?.site ?? null],
      ]},
      { title: 'Hardware', rows: [
        ['CPU Cores', w.cpuCores || null],
        ['CPU',       (w.cpuType && w.cpuType !== 'unknown') ? w.cpuType : null],
        ['GPU Cores', w.gpuCores || null],
        ['GPU',       (w.gpuType && w.gpuType !== 'unknown') ? w.gpuType : null],
        ['RAM', (w.ram && w.ram > 1024*1024) ? (Math.round(w.ram/(1024**3)*10)/10)+' GB' : 'unknown'],
      ]},
      { title: 'Earnings', rows: [
        ['Account',    w.earningsAccount],
        ['Total',      fmtDcc(w.earnings)],
        ['Last Active',timeAgo(w.taskTime)],
      ]},
    ];
    grid.innerHTML = sections
      .filter(s => s.rows.some(r => r[1] != null && r[1] !== ''))
      .map(s => `
        <div class="detail-group">
          <h4>${s.title}</h4>
          ${s.rows.filter(r => r[1] != null && r[1] !== '').map(r => `
            <div class="detail-row">
              <span class="detail-key">${r[0]}</span>
              <span class="detail-val">${String(r[1])}</span>
            </div>`).join('')}
        </div>`).join('');
  }



  function renderPage() {
    const tbody = document.getElementById('workers-tbody');
    const start = currentPage * PAGE_SIZE;
    const slice = filtered.slice(start, start + PAGE_SIZE);
    const total = filtered.length;

    if (!slice.length) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="7">No workers found.</td></tr>`;
    } else {
      tbody.innerHTML = slice.map(w => {
        const running  = w.running === true || w.running === 'yes';
        const dotCls   = running ? 'dot-green' : 'dot-red';
        const checked  = selectedIds.has(w.workerOpaqueId) ? 'checked' : '';
        const isSel    = selectedId === (w.id ?? w.workerOpaqueId);
        const icon     = workerIcon(w);
        const iconHtml = icon
          ? `<div class="worker-icon">${icon}</div>`
          : `<div class="worker-icon" style="font-size:11px">?</div>`;
          return `
            <tr class="${isSel ? 'selected' : ''}" data-worker="${encodeURIComponent(JSON.stringify(w))}" onclick="rowClick(event, this)">
              <td onclick="event.stopPropagation()">
                <input type="checkbox" ${checked} data-id="${w.workerOpaqueId}"
                  onchange="toggleCheck('${w.workerOpaqueId}', this.checked)">
              </td>
              <td><span class="dot ${dotCls}"></span></td>
              <td>${iconHtml}</td>
              <td><span class="label-text">${w.label ? String(w.label).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`) : '<span style="color:var(--text-dim);font-style:italic">unlabelled</span>'}</span></td>
              <td class="mono">${trunc(w.workerOpaqueId, 12)}</td>
              <td class="mono">${timeAgo(w.taskTime)}</td>
              <td class="earnings-val">${fmtDcc(w.earnings)}</td>
            </tr>
            <tr class="detail-row-inline ${isSel ? 'open' : ''}" data-detail-for="${w.id ?? w.workerOpaqueId}">
              <td colspan="7" class="detail-row-inline-cell">
                <div class="detail-inner" id="detail-grid-${w.id ?? w.workerOpaqueId}"></div>
              </td>
            </tr>`; 
          }).join('');

      if (selectedId) populateDetailGrid(selectedId);
    }

    document.getElementById('pg-prev').disabled = currentPage === 0;
    document.getElementById('pg-next').disabled = start + PAGE_SIZE >= total;
    document.getElementById('pg-info').textContent = total
      ? `${start+1}–${Math.min(start+PAGE_SIZE, total)} / ${total}`
      : '0';

    updateStats();
    updateDeleteBtn();
  }

  function changePage(dir) {
    currentPage = Math.max(0, currentPage + dir);
    renderPage();
  }

  function updateStats() {
    const active = allWorkers.filter(w => w.running === true || w.running === 'yes');
    const total  = allWorkers;

    document.getElementById('hdr-active').textContent = active.length;
    document.getElementById('hdr-total').textContent  = total.length;

    const sum = (arr, field) => arr.reduce((acc, w) => acc + (Number(w[field]) || 0), 0);

    document.getElementById('hdr-cpus-active').textContent = sum(active, 'cpuCores');
    document.getElementById('hdr-cpus-total').textContent  = sum(total,  'cpuCores');
    document.getElementById('hdr-gpus-active').textContent = sum(active, 'gpuCores');
    document.getElementById('hdr-gpus-total').textContent  = sum(total,  'gpuCores');
  }

  function toggleCheck(id, checked) {
    checked ? selectedIds.add(id) : selectedIds.delete(id);
    updateDeleteBtn();
    const page = filtered.slice(currentPage*PAGE_SIZE, (currentPage+1)*PAGE_SIZE);
    document.getElementById('select-all').checked = page.every(w => selectedIds.has(w.workerOpaqueId));
  }

  function toggleSelectAll(checked) {
    filtered.slice(currentPage*PAGE_SIZE, (currentPage+1)*PAGE_SIZE)
      .forEach(w => checked ? selectedIds.add(w.workerOpaqueId) : selectedIds.delete(w.workerOpaqueId));
    renderPage();
  }

  function updateDeleteBtn() {
    document.getElementById('btn-delete').disabled = selectedIds.size === 0;
  }

  function rowClick(ev, row) {
    if (ev.target.tagName === 'INPUT') return;
    const w  = JSON.parse(decodeURIComponent(row.dataset.worker));
    const id = w.id ?? w.workerOpaqueId;
    if (selectedId === id) { closeDetail(); return; }
    selectedId = id;
    renderPage();
  }

  function closeDetail() {
    selectedId = null;
    renderPage();
  }

  function deleteSelected() {
    if (!selectedIds.size) return;
    if (!confirm(`Delete ${selectedIds.size} worker(s)? They will revert to default configuration on next restart.`)) return;
    (async () => {
      try {
        const conn = await getDb();
        for (const opaqueId of selectedIds) {
          await conn.delete({ table: 'worker', prototype: { opaqueId } });
          for (const t of ['dcpWorkerAppConfig','workerRunInfo','workerTaskInfo','workerConfigValue','workerNotifications','workerCreds'])
            try { await conn.delete({ table: t, prototype: { workerOpaqueId: opaqueId } }); } catch(_) {}
        }
        selectedIds.clear();
        document.getElementById('select-all').checked = false;
        updateDeleteBtn();
        await loadWorkers(true);
      } catch(e) {
        setNotice('Delete failed: ' + e.message);
      }
    })();
  }

  async function loadWorkers(manual = false) {
    if (manual) {
      closeDetail();
      currentPage = 0;
      document.getElementById('workers-tbody').innerHTML =
        '<tr class="empty-row"><td colspan="7">Refreshing…</td></tr>';
    }
    setNotice('');
    const rows = await fetchWorkerSnapshots();
    if (rows === null) {
      setNotice('Could not reach the scheduler.');
      document.getElementById('workers-tbody').innerHTML =
        '<tr class="empty-row"><td colspan="7">Unable to load workers.</td></tr>';
      return;
    }
    allWorkers = rows;
    applySearch();
  }

  window.addEventListener('load', async () => {
    await loadWorkers();
    setInterval(() => loadWorkers(), 5000);
  });

</script>
</body>
</html>
